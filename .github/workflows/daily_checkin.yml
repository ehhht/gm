name: GameMale Daily Check-in

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      no_delay:
        description: '跳过随机启动延迟（仅测试用）'
        type: boolean
        default: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run check-in
        env:
          GM_USERNAME: ${{ secrets.GM_USERNAME }}
          GM_PASSWORD: ${{ secrets.GM_PASSWORD }}
          GM_COOKIE: ${{ secrets.GM_COOKIE }}
          GM_SKIP_DELAY: ${{ inputs.no_delay && '1' || '' }}
        run: |
          python gamemale_bot.py
